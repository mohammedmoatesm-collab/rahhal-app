name: Deploy Rahhal website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android app
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Add APK to website downloads
        run: |
          mkdir -p www/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk www/downloads/rahhal-android.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./www"

      - name: Deploy website and Android APK
        id: deployment
        uses: actions/deploy-pages@v4
